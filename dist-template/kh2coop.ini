; KH2FM Split-Screen Co-op — optional settings (place next to the game exe)

[keys]
; keyboard key that toggles split screen by hand (it also turns on by itself when player 2 joins)
split=F8
; re-binds a second Sora that already existed when the mod was (re)loaded — developer use
repair=F7

[coop]
; 1: player 2 plays a second Sora (default)   0: player 2 controls Goofy (legacy, limited)
second_sora=1
